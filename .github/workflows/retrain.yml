name: CatBoost Retraining Pipeline

on:
  schedule:
    # 19:00 UTC = 02:00 Vietnam time (next day)
    - cron: "0 19 * * *"

  workflow_dispatch:
    inputs:
      force:
        description: "Chạy retraining ngay, bỏ qua chu kỳ 72 giờ"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: catboost-retraining-pipeline
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
      HF_MODEL_REPO: ${{ secrets.HF_MODEL_REPO }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CatBoost retraining
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            python src/retrain.py --force
          else
            python src/retrain.py
          fi
