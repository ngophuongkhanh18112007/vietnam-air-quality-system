
name: CatBoost Model Retraining

on:
  schedule:
    - cron: "23 19 * * *"

  workflow_dispatch:
    inputs:
      check_only:
        description: "Chỉ kiểm tra hệ thống, không huấn luyện"
        required: true
        default: true
        type: boolean

      force:
        description: "Bỏ qua chu kỳ 72 giờ nếu chọn Train"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: air-quality-model-retraining
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
      HF_MODEL_REPO: ${{ secrets.HF_MODEL_REPO }}

      CHECK_ONLY: ${{ inputs.check_only || 'false' }}
      FORCE_RETRAIN: ${{ inputs.force || 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check environment
        run: |
          python -c "import os; assert os.getenv('HF_TOKEN'), 'Missing HF_TOKEN'"
          python -c "import os; assert os.getenv('HF_DATASET_REPO'), 'Missing HF_DATASET_REPO'"
          python -c "import os; assert os.getenv('HF_MODEL_REPO'), 'Missing HF_MODEL_REPO'"
          echo "Environment configuration: OK"

      - name: Run check-only mode
        if: env.CHECK_ONLY == 'true'
        run: |
          python src/retrain.py --check-only

      - name: Run forced retraining
        if: env.CHECK_ONLY != 'true' && env.FORCE_RETRAIN == 'true'
        run: |
          python src/retrain.py --force

      - name: Run scheduled retraining
        if: env.CHECK_ONLY != 'true' && env.FORCE_RETRAIN != 'true'
        run: |
          python src/retrain.py
