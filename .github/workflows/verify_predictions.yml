name: Verify Predictions

on:
  schedule:
    - cron: "40 20 * * *"   # mỗi ngày (UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: air-quality-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
      HF_MODEL_REPO: ${{ secrets.HF_MODEL_REPO }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify predictions against actual data
        run: python src/verify_predictions.py --days 30
